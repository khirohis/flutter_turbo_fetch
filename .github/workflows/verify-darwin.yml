name: Verify Darwin (iOS / macOS)

# Manual trigger only to avoid unnecessary macOS runner credit usage.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target Darwin platform to build and test'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ios
          - macos

permissions:
  contents: read

jobs:
  verify_ios:
    name: Build & Test iOS (Simulator)
    if: ${{ inputs.platform == 'all' || inputs.platform == 'ios' }}
    runs-on: macos-latest # Apple Silicon (M-series) runner
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: '.fvmrc'
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          cd example
          flutter pub get

      - name: Prepare iOS Example (Simulator Debug config)
        run: |
          cd example
          flutter build ios --simulator --debug --config-only

      - name: Run iOS RunnerTests
        run: |
          set -euo pipefail
          SIMULATOR_UDID=$(
            xcrun simctl list devices available iPhone \
              | grep -oiE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' \
              | tail -n 1 || true
          )
          if [ -z "$SIMULATOR_UDID" ]; then
            echo "Error: No available iPhone Simulator found." >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using iPhone Simulator UDID: $SIMULATOR_UDID"

          RESULT_BUNDLE="example/build/ios-RunnerTests.xcresult"
          mkdir -p example/build
          rm -rf "$RESULT_BUNDLE"

          xcrun xcodebuild test \
            -workspace example/ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -only-testing:RunnerTests \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RESULT_BUNDLE" \
            CODE_SIGNING_ALLOWED=NO

      - name: Collect iOS diagnostics on failure or cancel
        if: failure() || cancelled()
        run: |
          DIAG_DIR="example/build/ios-diagnostics"
          mkdir -p "$DIAG_DIR"
          {
            echo "=== Timestamp (UTC) ==="
            date -u +"%Y-%m-%dT%H:%M:%SZ"
            echo ""
            echo "=== Simulator devices ==="
            xcrun simctl list devices || true
            echo ""
            echo "=== Simulator runtimes ==="
            xcrun simctl list runtimes || true
            echo ""
            echo "=== Recent DiagnosticReports (user) ==="
            ls -lt "$HOME/Library/Logs/DiagnosticReports" 2>/dev/null | head -n 30 || true
            echo ""
            echo "=== Recent DiagnosticReports (system) ==="
            ls -lt /Library/Logs/DiagnosticReports 2>/dev/null | head -n 30 || true
          } | tee "$DIAG_DIR/simulator-status.txt"

          # Copy relevant crash/hang reports if present
          for dir in "$HOME/Library/Logs/DiagnosticReports" "/Library/Logs/DiagnosticReports"; do
            if [ -d "$dir" ]; then
              find "$dir" -maxdepth 2 -type f \
                \( -name '*Runner*' -o -name '*xctest*' -o -name '*testmanagerd*' -o -name '*CoreSimulator*' \) \
                \( -name '*.ips' -o -name '*.crash' -o -name '*.diag' \) \
                -exec cp -p {} "$DIAG_DIR/" \; 2>/dev/null || true
            fi
          done

      - name: Upload iOS test artifacts on failure or cancel
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: ios-RunnerTests-artifacts
          path: |
            example/build/ios-RunnerTests.xcresult
            example/build/ios-diagnostics
          if-no-files-found: ignore

  verify_macos:
    name: Build & Test macOS
    if: ${{ inputs.platform == 'all' || inputs.platform == 'macos' }}
    runs-on: macos-latest # Apple Silicon (M-series) runner
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: '.fvmrc'
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          cd example
          flutter pub get

      - name: Prepare macOS Example (Debug config)
        run: |
          cd example
          flutter build macos --debug --config-only

      - name: Run macOS RunnerTests
        run: |
          set -euo pipefail
          RESULT_BUNDLE="example/build/macos-RunnerTests.xcresult"
          mkdir -p example/build
          rm -rf "$RESULT_BUNDLE"

          # Use ad-hoc signing without CODE_SIGNING_REQUIRED=NO so Flutter's xcode_backend.dart
          # also ad-hoc signs embedded App.framework / FlutterMacOS.framework under App Sandbox.
          xcrun xcodebuild test \
            -workspace example/macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination "platform=macOS" \
            -only-testing:RunnerTests \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RESULT_BUNDLE" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual

      - name: Upload macOS xcresult on failure or cancel
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: macos-RunnerTests-xcresult
          path: example/build/macos-RunnerTests.xcresult
          if-no-files-found: ignore
