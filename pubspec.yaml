name: flutter_turbo_fetch
description: "High-performance HTTP/2 batch fetch and zero-copy transform plugin for Dio."
version: 0.0.2
repository: https://github.com/khirohis/flutter_turbo_fetch
issue_tracker: https://github.com/khirohis/flutter_turbo_fetch/issues
topics:
  - dio
  - http2
  - networking
  - performance
  - isolate

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^22.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.github.khirohis.flutter_turbo_fetch
        pluginClass: FlutterTurboFetchPlugin
      ios:
        pluginClass: FlutterTurboFetchPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: FlutterTurboFetchPlugin
        sharedDarwinSource: true
      windows:
        pluginClass: FlutterTurboFetchPluginCApi
