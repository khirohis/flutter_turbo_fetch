name: flutter_turbo_fetch_example
description: "Benchmark and verification app for the flutter_turbo_fetch plugin."
publish_to: 'none'

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_turbo_fetch:
    path: ../
  dio: ^5.4.0
  dio_http2_adapter: ^2.5.3
  native_dio_adapter: ^1.3.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
